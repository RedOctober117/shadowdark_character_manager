[[gear]]
name = "Backpack"
identity = "core::gear::backpack"
cost = { value = 2, unit = "core::currency::gp" }
slots = { value = 1, free-to-carry = 1 }
amount = 1

[[gear]]
name = "Holy Symbol"
identity = "core::class::priest::deity::holy-symbol"
cost = {}
slots = 0
amount = 1

[[talents]]
name = "Mighty"
description = "You have a +1 bonus to attack and damage rolls with melee weapons."
identity = "core::ancestry::half-orc::mighty"
bonus = { value = 1, to = [
    "core::weapon::melee",
    "core::weapon::ranged",
], when = [
    "sheet::action::roll::attack",
    "sheet::action::roll::damage",
] }

[[talents]]
description = "+1 to priest spellcasting checks"
identity = "core::class::priest::talents"
bonus = { value = 1, to = "sheet::action::roll::check::spellcasting" }

[[talents]]
name = "Languages"
description = "You know Celestial, Diabolic, or Primordial."
identity = "core::class::priest::languages"
bonus.choose.amount = 1
bonus.choose.from = [
    "core::language::celestial",
    "core::language::diabolic",
    "core::language::primordial",
]

[[spells]]
name = "Cure Wounds"
description = """
Your touch restores ebbing life.

Roll a number of d6s equal to 1 +
half your level (rounded down).
One target you touch regains
that many hit points.
"""
identity = "core::spells::cure-wounds"
tier = 1
caster = "core::class::priest"
duration = "instant"
range = "core::range::close"
cast = { roll = [
    1,
    { divide = "sheet::level", by = 2, round = "down" },
], d = 6 }

[[spells]]
name = "Holy Weapon"
description = """
One weapon you touch is
imbued with a sacred blessing.
The weapon becomes magical
and has +1 to attack and damage
rolls for the duration.
"""
identity = "core::spells::holy-weapon"
tier = 1
caster = "core::class::priest"
duration = { rounds = 5 }
range = "core::range::close"
cast = { choose.item = "::weapon::", choose.from = "sheet::gear", choose.amount = 1, bonus = { value = 1, to = "self", when = [
    "sheet::action::roll::attack",
    "sheet::action::roll::damage",
] } }

[[spells]]
name = "Turn Undead"
description = """
You rebuke undead creatures,
forcing them to flee. You must
present a holy symbol to cast
this spell.

Undead creatures within near
of you must make a CHA check
vs. your spellcasting check. If a
creature fails by 10+ points and is
equal to or less than your level, it
is destroyed. Otherwise, on a fail,
it flees from you for 5 rounds.
"""
identity = "core::spells::turn-undead"
tier = 1
caster = "core::class::priest"
duration = { rounds = 5 }
range = "core::range::close"
cast = { requires = "core::class::priest::deity::holy-symbol", check = "sheet::action::roll::check::spellcasting" }
