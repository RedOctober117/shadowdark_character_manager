# `self` referes to the containing item
# `sheet` referes to the character sheet itself
# `core` referes to the core rulebook

name = "Iraga Draguul"
ancestry = "core::ancestry::half-orc"
class = "core::class::priest"
level = 1
xp = 0
alignment = "core::alignment::lawful"
deity = "core::deity::saint-terragnis"
title = "core::title::acolyte"
background = "core::background::urchin"

hp = 5
armor-class = 0

[[languages]]
name = "Common"
identity = "core::ancestry::half-orc::language::common"

[[languages]]
name = "Orcish"
identity = "core::ancestry::half-orc::language::orchish"

[[languages]]
name = "Celestial"
identity = "core::language::celestial"
from = "sheet::talents::Languages::0"  # arrays index at 0?

[stats]
strength = 16
dexterity = 9
constitution = 13
intelligence = 10
wisdom = 15
charisma = 12

