cost = { unit = "gp", value = 60 }
bonus.value = { sum = [13, "sheet::stats::dexterity::modifier"] }
bonus.to = "sheet::armor-class"
properties = [
    { bonus = "core::roll::disadvantage", to = "swim" },
    { bonus = "core::roll::disadvantage", to = "stealth" },
]
amount = 1

